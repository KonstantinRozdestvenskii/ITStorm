<div class="article-card">
  <div class="article-card-category">{{ article.category }}</div>
  <div class="article-card-image">
    <img src="assets/images/pages/articles/{{ article.image }}" alt="Изображение статьи">
  </div>
  <div class="article-card-title">{{ article.title }}</div>
  <div class="article-card-description">{{ article.description }}</div>
  <div class="article-card-action">
    <a>Читать дальше</a>
  </div>
</div>
