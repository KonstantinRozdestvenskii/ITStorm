<div class="request-popup">
  <div class="close" (click)="close()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0.935622" y1="0.650002" x2="12.9564" y2="12.6708" stroke="#BEBEBE" stroke-linecap="round"/>
      <line x1="12.9236" y1="0.629787" x2="0.902769" y2="12.6506" stroke="#BEBEBE" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="request-popup-title" *ngIf="data.type === requestType.order && !isSuccess">
    Заявка на услугу
  </div>
  <div class="request-popup-title" *ngIf="data.type === requestType.consultation && !isSuccess">
    Закажите бесплатную консультацию!
  </div>
  <div class="request-popup-title" *ngIf="isSuccess">
    Спасибо за вашу заявку!
  </div>
  <div class="success-message" *ngIf="isSuccess">Мы свяжемся с вами при первой же возможности.</div>
  <div class="success-action" *ngIf="isSuccess">
    <button class="button button-small" (click)="close()">Окей</button>
  </div>
  <form class="request-popup-form" *ngIf="!isSuccess" [formGroup]="requestForm" (ngSubmit)="sendRequest()">
    <div class="request-popup-select" *ngIf="data.type === requestType.order">
      <select class="input" name="service-select" formControlName="service">
        <option *ngFor="let service of services" [value]="service.value">
          {{ service.label }}
        </option>
      </select>
    </div>
    <div class="request-popup-input">
      <input class="input" type="text" placeholder="Ваше имя"
             [ngStyle]="{'border-color': requestForm.get('name')?.invalid
             && (requestForm.get('name')?.touched || requestForm.get('name')?.dirty) ? 'red' : ''}"
             formControlName="name">
      <div class="invalid-feedback" *ngIf="requestForm.get('name')?.invalid
                && (requestForm.get('name')?.touched || requestForm.get('name')?.dirty)
                && requestForm.get('name')?.errors?.['required']">
        Введите имя
      </div>
    </div>
    <div class="request-popup-input">
      <input class="input" type="text" placeholder="Ваш номер телефона"
             [ngStyle]="{'border-color': requestForm.get('phoneNumber')?.invalid
             && (requestForm.get('phoneNumber')?.touched || requestForm.get('phoneNumber')?.dirty) ? 'red' : ''}"
             formControlName="phoneNumber">
      <div class="invalid-feedback" *ngIf="requestForm.get('phoneNumber')?.invalid
                && (requestForm.get('phoneNumber')?.touched || requestForm.get('phoneNumber')?.dirty)
                && requestForm.get('phoneNumber')?.errors?.['required']">
        Введите номер телефона
      </div>
    </div>
    <div class="request-popup-action">
      <button class="button" *ngIf="data.type === requestType.order" [disabled]="requestForm.invalid">Оставить заявку</button>
      <button class="button" *ngIf="data.type === requestType.consultation" [disabled]="requestForm.invalid">Заказать консультацию</button>
    </div>
    <div class="error-message" *ngIf="isErrorShow">
      Ошибка при отправке формы. Попробуйте еще раз
    </div>
  </form>
</div>
